{{/* Default-deny NetworkPolicy with an explicit allow list. */}}
{{- define "platform-common.networkPolicy" -}}
{{- $np := .Values.networkPolicy | default dict -}}
{{- if $np.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-common.fullname" . }}
  labels: {{- include "platform-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "platform-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range $np.allowIngressFrom }}
    - from:
        {{- if .namespaceSelector }}
        - namespaceSelector:
            matchLabels: {{- toYaml .namespaceSelector | nindent 14 }}
          {{- with .podSelector }}
          podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- else if .podSelector }}
        - podSelector:
            matchLabels: {{- toYaml .podSelector | nindent 14 }}
        {{- else if .ipBlock }}
        - ipBlock: {{- toYaml .ipBlock | nindent 12 }}
        {{- end }}
      {{- with .ports }}
      ports: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  egress:
    # DNS is always required
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with $np.allowEgressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
{{- end -}}
