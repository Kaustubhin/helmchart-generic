{{- define "platform-common.ingress" -}}
{{- $ing := .Values.ingress | default dict -}}
{{- if $ing.enabled -}}
{{- $fullName := include "platform-common.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels: {{- include "platform-common.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations: {{- include "platform-common.tpl" (dict "value" . "ctx" $) | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls }}
  tls:
    {{- range $ing.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ tpl . $ | quote }}
        {{- end }}
      secretName: {{ tpl .secretName $ | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ing.hosts }}
    - host: {{ tpl .host $ | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .serviceName | default $fullName }}
                port:
                  {{- if .portName }}
                  name: {{ .portName }}
                  {{- else }}
                  number: {{ .portNumber | default 80 }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end -}}
{{- end -}}
