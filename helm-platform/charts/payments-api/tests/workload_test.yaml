# helm unittest plugin: https://github.com/helm-unittest/helm-unittest
# run: helm unittest charts/payments-api
suite: payments-api workload
templates:
  - deployment.yaml
tests:
  - it: renders a non-root, capability-dropped container
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: resolves the image through the global registry
    set:
      image.tag: "4.11.2"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/payments/payments-api:4.11.2

  - it: prefers digest over tag
    set:
      image.digest: "sha256:aaaa"
      image.tag: "4.11.2"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/payments/payments-api@sha256:aaaa

  - it: drops the replicas field when the HPA owns scaling
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: refuses a mutable tag
    set:
      image.tag: latest
    asserts:
      - failedTemplate:
          errorMessage: "image.tag must be an immutable tag or image.digest must be set ('latest' is banned)"

  - it: refuses an untrusted registry
    set:
      image.registry: docker.io
    asserts:
      - failedTemplate: {}

  - it: bumps the pod when the ConfigMap changes
    set:
      config.timeoutSeconds: 31
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]
