{{/* Hook: runs before the new version is rolled out, blocks the release on failure. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform-common.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "platform-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "platform-common.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "platform-common.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "platform-common.image" . }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/app/payments-api", "migrate", "--wait"]
          envFrom: {{- include "platform-common.tpl" (dict "value" .Values.envFrom "ctx" $) | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
